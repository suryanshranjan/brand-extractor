<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brand Extractor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #ffffff; --subtle: #fafafa; --hover: #f4f4f5; --ink: #09090b; --ink-2: #3f3f46; --muted: #71717a; --faint: #a1a1aa;
  --line: #e4e4e7; --line-2: #f0f0f2; --focus: #2563eb;
  --green: #15803d; --amber: #b45309; --blue: #1d4ed8; --red: #b91c1c; --red-bg: #fef2f2; --red-line: #fecaca;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0a0a0b; --subtle: #111113; --hover: #18181b; --ink: #fafafa; --ink-2: #d4d4d8; --muted: #a1a1aa; --faint: #63636b;
    --line: #27272a; --line-2: #1c1c1f; --focus: #60a5fa;
    --green: #4ade80; --amber: #fbbf24; --blue: #93c5fd; --red: #f87171; --red-bg: #1f1012; --red-line: #4c1d1d;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; min-height: 100dvh; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.hidden { display: none !important; }
a { color: inherit; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

/* Top bar */
.topbar { height: 56px; flex: none; display: flex; align-items: center; gap: 16px; padding: 0 20px; border-bottom: 1px solid var(--line); }
.logo { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 15px; letter-spacing: -.01em; }
.logo svg { width: 22px; height: 22px; }
.sep { width: 1px; height: 20px; background: var(--line); }
.source { color: var(--muted); font-size: 13px; }
.health { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex: none; }
.dot.ok { background: var(--green); } .dot.bad { background: var(--red); }

.btn.ig-btn { height: 32px; padding: 0 12px; font-size: 13px; }
.btn.ig-btn .dot { width: 7px; height: 7px; }

/* Dialog */
dialog { width: min(480px, calc(100vw - 32px)); border: 1px solid var(--line); border-radius: 12px; padding: 0; background: var(--bg); color: var(--ink);
  box-shadow: 0 24px 48px -12px rgba(0, 0, 0, .25); }
dialog::backdrop { background: rgba(9, 9, 11, .45); }
.dlg-head { padding: 20px 24px 0; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.dlg-head h2 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: -.01em; }
.dlg-head p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
.x { border: 0; background: none; width: 32px; height: 32px; border-radius: 6px; cursor: pointer; color: var(--muted); display: grid; place-items: center; flex: none; }
.x:hover { background: var(--hover); color: var(--ink); }
.x svg { width: 16px; height: 16px; }
.dlg-body { padding: 16px 24px 24px; display: grid; gap: 14px; }
.dlg-body .tabs { margin-top: 0; }
.dlg-body label.lbl { display: grid; gap: 6px; font-size: 13px; font-weight: 500; color: var(--ink-2); }
.dlg-body .field { width: 100%; }
.dlg-body .btn.primary { justify-content: center; }
.hint { font-size: 13px; color: var(--muted); margin: 0; }
.hint code, .note code, .alert code, .empty code { font-family: ui-monospace, Consolas, monospace; font-size: 12px; background: var(--hover); padding: 1px 5px; border-radius: 4px; }
.warn { font-size: 13px; color: var(--ink-2); padding: 10px 12px; border-radius: 8px; background: var(--subtle); border: 1px solid var(--line); }
.account { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 8px; }
.account b { font-weight: 500; }
.waiting { display: flex; gap: 10px; align-items: center; font-size: 13px; padding: 12px 14px; border-radius: 8px; background: var(--subtle); border: 1px solid var(--line); }
.spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--ink); animation: rot .8s linear infinite; flex: none; }
@keyframes rot { to { transform: rotate(360deg); } }
.dlg-error { font-size: 13px; color: var(--red); }
.callout { display: flex; gap: 16px; align-items: center; justify-content: space-between; margin: 24px auto 0; max-width: 480px;
  padding: 14px 16px; border: 1px solid var(--line); border-radius: 10px; text-align: left; font-size: 13px; color: var(--ink-2); }
.callout .btn { flex: none; }
.alert .btn { margin-top: 12px; }
@media (max-width: 560px) { .callout { flex-direction: column; align-items: stretch; } }

/* Scan bar */
.scanbar { flex: none; padding: 16px 20px; border-bottom: 1px solid var(--line); background: var(--subtle); }
.scanbar form { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 8px; max-width: 880px; }
.field { display: flex; align-items: center; height: 40px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg);
  transition: border-color .15s, box-shadow .15s; }
.field:focus-within { border-color: var(--focus); box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 15%, transparent); }
.field .at { padding-left: 12px; color: var(--faint); }
.field input, .field select { border: 0; outline: 0; background: transparent; height: 100%; padding: 0 12px; min-width: 0; }
.field input { flex: 1; }
.field .at + input { padding-left: 3px; }
.field select { padding-right: 8px; cursor: pointer; }
.btn { height: 40px; padding: 0 16px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); cursor: pointer;
  display: inline-flex; align-items: center; gap: 8px; font-weight: 500; text-decoration: none; white-space: nowrap; transition: background .15s; }
.btn:hover { background: var(--hover); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.primary { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.btn.primary:hover:not(:disabled) { opacity: .88; background: var(--ink); }
.btn.sm { height: 32px; padding: 0 12px; font-size: 13px; }
.btn svg { width: 15px; height: 15px; flex: none; }
.opts { display: flex; gap: 20px; margin-top: 10px; font-size: 13px; color: var(--ink-2); flex-wrap: wrap; }
.opts label { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
.opts input { width: 15px; height: 15px; margin: 0; accent-color: var(--ink); }
.form-error { margin-top: 10px; font-size: 13px; color: var(--red); }
.keybar { display: flex; gap: 8px; align-items: center; margin-top: 12px; max-width: 880px; font-size: 13px; }
.keybar .field { flex: 1; }

/* Workspace */
.workspace { flex: 1; min-height: 0; display: grid; grid-template-columns: 320px minmax(0, 1fr); }
.list-pane { border-right: 1px solid var(--line); overflow-y: auto; }
.pane-head { position: sticky; top: 0; background: var(--bg); padding: 14px 20px 10px; font-size: 13px; font-weight: 500; color: var(--muted);
  display: flex; justify-content: space-between; border-bottom: 1px solid var(--line-2); z-index: 1; }
.jobs { list-style: none; margin: 0; padding: 6px 8px; }
.jobs li[data-id] { padding: 10px 12px; border-radius: 8px; cursor: pointer; display: grid; gap: 2px; }
.jobs li[data-id]:hover { background: var(--hover); }
.jobs li.active { background: var(--hover); }
.jobs .top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.jobs .t { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.jobs .when { color: var(--faint); font-size: 12px; flex: none; }
.jobs .s { color: var(--muted); font-size: 13px; display: flex; align-items: center; gap: 6px; min-width: 0; }
.jobs .s span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.jobs .progress { margin-top: 6px; }
.jobs .none { padding: 12px; color: var(--muted); font-size: 13px; }

.state { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); white-space: nowrap; }
.state::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
.state.done::before { background: var(--green); }
.state.partial::before { background: var(--amber); }
.state.failed::before { background: var(--red); }
.state.running::before { background: var(--blue); animation: blink 1.2s ease-in-out infinite; }
.state.queued::before { background: var(--faint); }
@keyframes blink { 50% { opacity: .3; } }

.progress { height: 4px; border-radius: 4px; background: var(--line); overflow: hidden; }
.progress > i { display: block; height: 100%; background: var(--blue); transform-origin: left; transition: transform .5s ease; }

/* Detail */
.detail-pane { overflow-y: auto; }
.detail { max-width: 1120px; padding: 28px 32px 40px; }
.d-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.d-head h1 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -.02em; }
.d-head h1 a { text-decoration: none; }
.d-head h1 a:hover { text-decoration: underline; text-underline-offset: 4px; }
.meta { margin-top: 6px; display: flex; gap: 14px; flex-wrap: wrap; color: var(--muted); font-size: 13px; align-items: center; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }

.figures { display: flex; gap: 48px; margin: 28px 0 8px; flex-wrap: wrap; }
.fig dt { font-size: 13px; color: var(--muted); }
.fig dd { margin: 2px 0 0; font-size: 24px; font-weight: 600; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }

.tabs { display: flex; align-items: flex-end; gap: 24px; border-bottom: 1px solid var(--line); margin-top: 24px; }
.tabs button { border: 0; background: none; padding: 10px 0; margin-bottom: -1px; cursor: pointer; color: var(--muted); font-weight: 500;
  border-bottom: 2px solid transparent; display: inline-flex; gap: 6px; }
.tabs button:hover { color: var(--ink); }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); }
.tabs .count { color: var(--faint); font-weight: 400; }
.tabs .field { margin: 0 0 8px auto; height: 34px; width: 240px; }
.tabs .field svg { width: 15px; height: 15px; margin-left: 10px; color: var(--faint); flex: none; }
.tabs .field input { font-size: 13px; padding: 0 10px 0 8px; }

.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font-weight: 500; font-size: 13px; color: var(--muted); padding: 12px 16px 10px 0; white-space: nowrap; border-bottom: 1px solid var(--line); }
td { padding: 12px 16px 12px 0; border-bottom: 1px solid var(--line-2); white-space: nowrap; }
th:last-child, td:last-child { padding-right: 0; }
th.r, td.r { text-align: right; }
tbody tr:hover td { background: var(--subtle); }
td .name { font-weight: 500; }
td .known { margin-left: 6px; color: var(--green); vertical-align: -2px; }
td .known svg { width: 14px; height: 14px; }
td a.handle { color: var(--muted); text-decoration: none; }
td a.handle:hover { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
td a.posts { text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }
td a.posts:hover { text-decoration-color: currentColor; }
.kind { display: inline-flex; align-items: center; gap: 7px; color: var(--ink-2); text-transform: capitalize; }
.kind::before { content: ""; width: 7px; height: 7px; border-radius: 2px; background: var(--faint); }
.kind.brand::before { background: var(--green); }
.kind.creator::before { background: var(--amber); }
.kind.organization::before { background: var(--blue); }
.no-rows { text-align: center; color: var(--muted); padding: 40px 0; white-space: normal; }

.progress-block { margin-top: 28px; padding: 20px; border: 1px solid var(--line); border-radius: 10px; max-width: 560px; }
.progress-block .row { display: flex; justify-content: space-between; margin-bottom: 10px; font-weight: 500; }
.progress-block p { margin: 10px 0 0; font-size: 13px; color: var(--muted); }
.alert { margin-top: 24px; padding: 14px 16px; border: 1px solid var(--red-line); background: var(--red-bg); border-radius: 10px; max-width: 720px; }
.alert b { display: block; color: var(--red); font-weight: 500; margin-bottom: 2px; }
.alert span { color: var(--ink-2); font-size: 13px; }
.note { margin-top: 24px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; color: var(--ink-2); font-size: 13px; max-width: 720px; }

.empty { height: 100%; min-height: 360px; display: grid; place-items: center; text-align: center; padding: 40px 20px; }
.empty svg { width: 36px; height: 36px; color: var(--faint); }
.empty h2 { margin: 14px 0 4px; font-size: 16px; font-weight: 600; }
.empty p { margin: 0 auto; color: var(--muted); max-width: 40ch; }

.sk { background: var(--hover); border-radius: 6px; animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .5; } }

@media (max-width: 860px) {
  body { display: block; }
  .workspace { display: block; }
  .detail-pane { overflow: visible; }
  .list-pane { border-right: 0; border-bottom: 1px solid var(--line); max-height: 260px; }
  .detail { padding: 20px 16px 32px; }
  .scanbar { padding: 12px 16px; }
  .scanbar form { grid-template-columns: 1fr auto; }
  .scanbar form .field:first-child { grid-column: 1 / -1; }
  .scanbar form .btn { justify-content: center; }
  .topbar { padding: 0 16px; } .sep, .source, .health { display: none; }
  .logo { white-space: nowrap; } .btn.ig-btn { margin-left: auto; }
  .figures { gap: 28px; }
  .tabs { flex-wrap: wrap; } .tabs .field { width: 100%; margin: 8px 0; order: 3; }
}
@media (prefers-reduced-motion: reduce) { *, *::before { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<header class="topbar">
  <div class="logo">
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="1.5" y="1.5" width="21" height="21" rx="6" fill="currentColor"/><circle cx="12" cy="12" r="4.5" stroke="var(--bg)" stroke-width="1.8"/><circle cx="17.6" cy="6.4" r="1.3" fill="var(--bg)"/></svg>
    Brand Extractor
  </div>
  <span class="sep"></span>
  <span class="source" id="source"></span>
  <div class="health" title="Server status"><span class="dot" id="healthDot"></span><span id="health">Connecting…</span></div>
  <button class="btn ig-btn" id="igBtn" type="button">Connect Instagram</button>
</header>

<dialog id="igDialog" aria-labelledby="igTitle">
  <div class="dlg-head">
    <div><h2 id="igTitle">Instagram account</h2><p>Scans read Instagram while logged in as this account.</p></div>
    <button class="x" type="button" id="igClose" aria-label="Close"><svg viewBox="0 0 16 16" fill="none"><path d="m4 4 8 8m0-8-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button>
  </div>
  <div class="dlg-body" id="igBody"></div>
</dialog>

<section class="scanbar">
  <form id="scanForm">
    <label class="field"><span class="at">@</span><input type="text" id="target" placeholder="Instagram account or profile URL" required autocomplete="off" spellcheck="false" aria-label="Instagram account"></label>
    <label class="field" title="Recent posts to scan">
      <select id="limit" aria-label="Recent posts to scan">
        <option value="25">25 posts</option><option value="50" selected>50 posts</option><option value="100">100 posts</option>
        <option value="200">200 posts</option><option value="500">500 posts</option>
      </select>
    </label>
    <button type="submit" class="btn primary" id="startBtn">Scan account</button>
  </form>
  <div class="opts">
    <label title="Finds sponsor names that only appear in poster images"><input type="checkbox" id="ocr" checked> Read text in images</label>
    <label title="Ignore saved progress for this account"><input type="checkbox" id="fresh"> Start from scratch</label>
  </div>
  <div class="form-error hidden" id="formError"></div>
  <div class="keybar hidden" id="keyCard">
    <span class="muted">This server needs an API key.</span>
    <label class="field"><input type="password" id="apiKey" placeholder="API key" autocomplete="off" aria-label="API key"></label>
    <button class="btn" id="saveKey" type="button">Save</button>
  </div>
</section>

<div class="workspace">
  <nav class="list-pane" aria-label="Scans">
    <div class="pane-head"><span>Scans</span><span id="jobCount"></span></div>
    <ul class="jobs" id="jobs"></ul>
  </nav>
  <main class="detail-pane" id="detail"></main>
</div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = (n) => (n === null || n === undefined || n === "") ? "" : Number(n).toLocaleString();
const compact = (n) => (n === null || n === undefined || n === "") ? "—" : new Intl.NumberFormat("en", {notation: "compact", maximumFractionDigits: 1}).format(n);
let apiKey = "";
try { apiKey = localStorage.getItem("brandscan_key") || ""; } catch (e) {}
let selected = (location.hash.match(/^#\/scans\/(\w+)/) || [])[1] || null;
let showAll = false, timer = null, query = "", lastSig = "", current = null;
let ig = null, igMethod = "browser", igTimer = null, igError = "";

const ICON = {
  dl: '<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 2.5v8m0 0 3-3m-3 3-3-3M3 13.5h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  search: '<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="7" cy="7" r="4.5" stroke="currentColor" stroke-width="1.5"/><path d="m10.5 10.5 3 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>',
  check: '<svg viewBox="0 0 16 16" fill="none"><path d="M8 1.5 9.8 3l2.3-.2.6 2.2 2 1.2-1 2.1.6 2.2-2.1 1-.8 2.2-2.3-.4L8 14.5 6.2 13l-2.3.4-.8-2.2-2.1-1 .6-2.2-1-2.1 2-1.2.6-2.2L5.6 3 7.4 1.5Z" fill="currentColor" opacity=".25"/><path d="m5.5 8.2 1.7 1.6 3.3-3.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  scan: '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5" stroke="currentColor" stroke-width="1.5"/><circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.5"/><circle cx="17" cy="7" r="1" fill="currentColor"/></svg>',
};
const FILE_LABELS = {"brands.csv": "Brands CSV", "all_entities.csv": "All results CSV", "report.json": "JSON"};

async function api(path, opts = {}) {
  const headers = Object.assign({"Content-Type": "application/json"}, apiKey ? {"X-API-Key": apiKey} : {});
  const res = await fetch(path, Object.assign({headers}, opts));
  if (res.status === 401) { $("keyCard").classList.remove("hidden"); throw new Error("API key required"); }
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.detail ? (typeof body.detail === "string" ? body.detail : JSON.stringify(body.detail)) : res.statusText);
  return body;
}

function progressOf(job) {
  const p = job.progress || {};
  if (job.status === "queued") return {pct: 0, text: job.queue_position ? `Queued, ${job.queue_position} ahead` : "Queued"};
  if (job.status !== "running") return null;
  if (p.stage === "posts") return {pct: 10 + 60 * p.done / p.total, text: `Reading posts ${p.done} of ${p.total}`};
  if (p.stage === "lookups") return {pct: 70 + 28 * p.done / p.total, text: `Checking accounts ${p.done} of ${p.total}`};
  return {pct: 5, text: "Loading profile"};
}
const bar = (pr) => `<div class="progress"><i style="transform:scaleX(${Math.max(0, Math.min(100, pr.pct)) / 100})"></i></div>`;
const STATE = {done: "Done", partial: "Partial", failed: "Failed", running: "Running", queued: "Queued", cancelled: "Cancelled"};
const state = (s) => `<span class="state ${esc(s)}">${esc(STATE[s] || s)}</span>`;

function ago(ts) {
  const s = Math.max(0, Date.now() / 1000 - ts);
  if (s < 60) return "now";
  if (s < 3600) return `${Math.floor(s / 60)}m`;
  if (s < 86400) return `${Math.floor(s / 3600)}h`;
  if (s < 86400 * 7) return `${Math.floor(s / 86400)}d`;
  return new Date(ts * 1000).toLocaleDateString(undefined, {month: "short", day: "numeric"});
}

function select(id) {
  selected = id; showAll = false; query = "";
  history.replaceState(null, "", id ? `#/scans/${id}` : location.pathname);
}

function renderJobs(jobs) {
  const ul = $("jobs");
  $("jobCount").textContent = jobs.length || "";
  if (!jobs.length) { ul.innerHTML = '<li class="none">No scans yet.</li>'; return; }
  ul.innerHTML = jobs.map((j) => {
    const pr = progressOf(j);
    const sub = pr ? pr.text : (j.summary && j.summary.brands !== undefined
      ? `${fmt(j.summary.brands)} brands · ${fmt(j.summary.posts_scanned)} posts` : (j.message || ""));
    return `<li data-id="${esc(j.id)}" class="${j.id === selected ? "active" : ""}" title="${esc(new Date(j.created_at * 1000).toLocaleString())}">
      <div class="top"><span class="t">@${esc(j.target)}</span><span class="when">${esc(ago(j.created_at))}</span></div>
      <div class="s">${state(j.status)}<span>${pr || j.status === "done" || j.status === "partial" ? "· " + esc(sub) : ""}</span></div>
      ${pr ? bar(pr) : ""}
    </li>`;
  }).join("");
  ul.querySelectorAll("li[data-id]").forEach((li) => li.onclick = () => {
    if (selected === li.dataset.id) return;
    select(li.dataset.id); skeleton(); refresh();
    if (window.matchMedia("(max-width: 860px)").matches) $("detail").scrollIntoView({behavior: "smooth"});
  });
}

function fileLink(job, name) {
  const q = apiKey ? `?api_key=${encodeURIComponent(apiKey)}` : "";
  return `<a class="btn sm" href="/api/scans/${esc(job.id)}/files/${esc(name)}${q}" download>${ICON.dl}${esc(FILE_LABELS[name] || name)}</a>`;
}

function empty() {
  const nudge = ig && ig.source === "web" && !ig.connected
    ? `<div class="callout"><span>Connect an Instagram account first. Without one, Instagram shows at most the latest 12 posts, and often nothing.</span>
        <button class="btn sm primary" type="button" data-connect>Connect Instagram</button></div>` : "";
  return `<div class="empty"><div>${ICON.scan}<h2>No scans yet</h2>
    <p>Enter an Instagram account above to find the brands that sponsor or partner with it.</p>${nudge}</div></div>`;
}

/* --- Instagram connection --- */
function renderIgButton() {
  const b = $("igBtn");
  if (!ig) return;
  b.classList.remove("primary");
  if (ig.source === "graph") { b.innerHTML = `<span class="dot ${ig.connected ? "ok" : "bad"}"></span>Graph API`; return; }
  if (ig.connected) b.innerHTML = `<span class="dot ok"></span>${ig.username ? "@" + esc(ig.username) : "Instagram connected"}`;
  else if (ig.login.status === "waiting") b.innerHTML = '<span class="spin"></span>Logging in…';
  else { b.textContent = "Connect Instagram"; b.classList.add("primary"); }
}

function renderIgDialog() {
  const body = $("igBody");
  if (!ig) { body.innerHTML = '<p class="hint">Loading…</p>'; return; }
  const err = igError || (ig.login.status === "error" ? ig.login.error : "");
  const errHtml = err ? `<div class="dlg-error">${esc(err)}</div>` : "";
  if (ig.source === "graph") {
    body.innerHTML = `<div class="account"><b>Instagram Graph API</b>${state(ig.connected ? "done" : "failed")}</div>
      <p class="hint">${ig.connected ? "Scans use the official API token from the server settings."
        : "Set <code>IG_GRAPH_TOKEN</code> and <code>IG_GRAPH_USER_ID</code> in the server's <code>.env</code>, then restart it."}</p>`;
    return;
  }
  if (ig.connected) {
    body.innerHTML = `<div class="account"><div><b>${ig.username ? "@" + esc(ig.username) : "Session from server settings"}</b>
        <div><span class="state done">Connected</span></div></div>
        ${ig.manageable && ig.method === "saved" ? '<button class="btn sm" type="button" id="igDisconnect">Disconnect</button>' : ""}</div>
      ${ig.method === "env" ? "<p class=\"hint\">This session comes from <code>IG_SESSIONID</code> in the server's <code>.env</code>. Change it there.</p>" : ""}
      <p class="hint">If scans start failing with "session rejected", disconnect and connect again.</p>${errHtml}`;
    const d = $("igDisconnect");
    if (d) d.onclick = async () => { d.disabled = true; await igCall("/api/instagram", {method: "DELETE"}); };
    return;
  }
  if (!ig.manageable) {
    body.innerHTML = `<p class="hint">This server is shared, so its Instagram account is set up on the server itself with
      <code>brandscan login USERNAME</code> or <code>brandscan import-cookies FILE --as USERNAME</code>.</p>`;
    return;
  }
  if (ig.login.status === "waiting") {
    body.innerHTML = `<div class="waiting"><span class="spin"></span><span>A login window opened for <b>@${esc(ig.login.username)}</b>.
      Log in there; two-factor codes work. This updates when you're done.</span></div>`;
    return;
  }
  const method = ig.browser_login ? igMethod : "cookie";
  body.innerHTML = `
    <div class="warn">Use a spare account, not your personal one. Instagram can restrict accounts used for automated access.</div>
    ${ig.browser_login ? `<div class="tabs" role="tablist">
      <button type="button" role="tab" data-m="browser" aria-selected="${method === "browser"}">Log in with browser</button>
      <button type="button" role="tab" data-m="cookie" aria-selected="${method === "cookie"}">Paste session cookie</button></div>` : ""}
    <form id="igForm" style="display:grid;gap:14px">
      <label class="lbl">Instagram username
        <span class="field"><span class="at">@</span><input id="igUser" required autocomplete="off" spellcheck="false" value="${esc(ig.login.username || "")}"></span></label>
      ${method === "cookie" ? `<label class="lbl">sessionid cookie
        <span class="field"><input id="igSid" type="password" required autocomplete="off" placeholder="Paste the value"></span></label>
        <p class="hint">In a browser logged in to instagram.com, open DevTools, then Application → Cookies → instagram.com, and copy the <code>sessionid</code> value.</p>`
      : "<p class=\"hint\">A browser window opens on this computer. You log in there yourself; the app never sees your password.</p>"}
      ${errHtml}
      <button class="btn primary" type="submit">${method === "cookie" ? "Connect" : "Open login window"}</button>
    </form>`;
  body.querySelectorAll("[data-m]").forEach((t) => t.onclick = () => { igMethod = t.dataset.m; igError = ""; renderIgDialog(); });
  $("igForm").onsubmit = async (ev) => {
    ev.preventDefault();
    const username = $("igUser").value;
    if (method === "cookie") await igCall("/api/instagram/session", {method: "POST", body: JSON.stringify({username, sessionid: $("igSid").value})});
    else await igCall("/api/instagram/browser-login", {method: "POST", body: JSON.stringify({username})});
  };
}

async function igCall(path, opts) {
  igError = "";
  try { setIg(await api(path, opts)); } catch (e) { igError = e.message; renderIgDialog(); }
}

function setIg(info) {
  const wasConnected = ig && ig.connected;
  ig = info;
  renderIgButton();
  if ($("igDialog").open) renderIgDialog();
  clearTimeout(igTimer);
  if (ig.login.status === "waiting") igTimer = setTimeout(loadIg, 2000);
  if (wasConnected === false && ig.connected && $("igDialog").open) setTimeout(() => $("igDialog").close(), 900);
  if (lastSig === "empty" || (current && current.status === "failed")) { lastSig = ""; refresh(); }
}
async function loadIg() { try { setIg(await api("/api/instagram")); } catch (e) {} }
function openIg() { igError = ""; renderIgDialog(); $("igDialog").showModal(); loadIg(); }
$("igBtn").onclick = openIg;
$("igClose").onclick = () => $("igDialog").close();
$("igDialog").addEventListener("click", (e) => { if (e.target === $("igDialog")) $("igDialog").close(); });
document.addEventListener("click", (e) => { if (e.target.closest("[data-connect]")) openIg(); });

function skeleton() {
  lastSig = "";
  $("detail").innerHTML = `<div class="detail">
    <div class="sk" style="height:26px;width:220px"></div><div class="sk" style="height:14px;width:300px;margin-top:10px"></div>
    <div style="display:flex;gap:48px;margin:32px 0">${'<div><div class="sk" style="height:12px;width:60px"></div><div class="sk" style="height:24px;width:44px;margin-top:8px"></div></div>'.repeat(4)}</div>
    ${'<div class="sk" style="height:16px;margin:18px 0"></div>'.repeat(6)}</div>`;
}

function filtered(job) {
  const rows = (showAll ? job.entities : job.brands) || [];
  const q = query.trim().toLowerCase().replace(/^@/, "");
  if (!q) return rows;
  return rows.filter((b) => [b.name, b.handle, b.primary_role, b.type].some((v) => String(v || "").toLowerCase().includes(q)));
}

function rowsHtml(job) {
  const rows = filtered(job);
  if (!rows.length) return `<tr><td colspan="7" class="no-rows">${query ? "No results match your filter." : "Nothing found in the scanned posts."}</td></tr>`;
  return rows.map((b) => `<tr>
    <td><span class="name">${esc(b.name)}</span>${b.known_brand ? `<span class="known" title="In the known-brands list">${ICON.check}</span>` : ""}</td>
    <td>${b.handle ? `<a class="handle" href="${esc(b.profile_url)}" target="_blank" rel="noopener noreferrer">@${esc(b.handle)}</a>` : '<span class="muted">—</span>'}</td>
    <td><span class="kind ${esc(b.type)}">${esc(b.type)}</span></td>
    <td>${esc(b.primary_role)}</td>
    <td class="r num">${fmt(b.score)}</td>
    <td class="r num">${b.posts && b.posts.length ? `<a class="posts" href="https://www.instagram.com/p/${esc(b.posts[0])}/" target="_blank" rel="noopener noreferrer" title="Open the strongest post">${b.posts.length}</a>` : "0"}</td>
    <td class="r num">${b.followers ? esc(compact(b.followers)) : '<span class="muted">—</span>'}</td></tr>`).join("");
}

function renderDetail(job) {
  const d = $("detail");
  current = job;
  if (!job) { if (lastSig !== "empty") { d.innerHTML = empty(); lastSig = "empty"; } return; }
  const sig = JSON.stringify([job.id, job.status, job.progress, job.summary, job.message, showAll, (job.brands || []).length, (job.entities || []).length]);
  if (sig === lastSig) return;
  lastSig = sig;
  const s = job.summary || {}, pr = progressOf(job);
  const active = job.status === "queued" || job.status === "running";
  const started = new Date(job.created_at * 1000).toLocaleString(undefined, {dateStyle: "medium", timeStyle: "short"});
  d.innerHTML = `<div class="detail">
    <div class="d-head">
      <div>
        <h1><a href="https://www.instagram.com/${esc(job.target)}/" target="_blank" rel="noopener noreferrer">@${esc(job.target)}</a></h1>
        <div class="meta">${state(job.status)}${s.full_name ? `<span>${esc(s.full_name)}</span>` : ""}<span>${esc(started)}</span></div>
      </div>
      <div class="actions">${active ? '<button class="btn sm" id="cancelBtn">Cancel scan</button>' : (job.files || []).map((f) => fileLink(job, f)).join("")}</div>
    </div>
    ${pr ? `<div class="progress-block"><div class="row"><span>${esc(pr.text)}</span><span class="num muted">${Math.round(pr.pct)}%</span></div>${bar(pr)}
      <p>Results appear here when the scan finishes. You can close this page; the scan keeps running.</p></div>` : ""}
    ${job.message && !active ? (job.status === "failed"
      ? `<div class="alert"><b>Scan failed</b><span>${esc(job.message)}</span>${/log ?in|session/i.test(job.message) && ig && ig.source === "web" && ig.manageable
          ? `<div><button class="btn sm primary" type="button" data-connect>${ig.connected ? "Reconnect Instagram" : "Connect Instagram"}</button></div>` : ""}</div>`
      : `<div class="note">${esc(job.message)}</div>`) : ""}
    ${s.brands !== undefined ? `<dl class="figures">
      <div class="fig"><dt>Brands</dt><dd>${fmt(s.brands)}</dd></div>
      <div class="fig"><dt>Accounts &amp; names</dt><dd>${fmt(s.entities)}</dd></div>
      <div class="fig"><dt>Posts scanned</dt><dd>${fmt(s.posts_scanned)}</dd></div>
      <div class="fig"><dt>Followers</dt><dd>${esc(compact(s.followers))}</dd></div></dl>` : ""}
    ${job.brands ? `<div class="tabs" role="tablist">
        <button role="tab" data-all="0" aria-selected="${!showAll}">Brands <span class="count">${fmt(s.brands ?? job.brands.length)}</span></button>
        <button role="tab" data-all="1" aria-selected="${showAll}">All results <span class="count">${fmt(s.entities ?? "")}</span></button>
        <label class="field">${ICON.search}<input type="search" id="q" placeholder="Filter" value="${esc(query)}" aria-label="Filter results"></label>
      </div>
      <div class="tablewrap"><table><thead><tr><th>Name</th><th>Handle</th><th>Type</th><th>Role</th><th class="r">Score</th><th class="r">Posts</th><th class="r">Followers</th></tr></thead>
      <tbody id="rows">${rowsHtml(job)}</tbody></table></div>` : ""}
  </div>`;
  const c = $("cancelBtn"); if (c) c.onclick = async () => { c.disabled = true; await api(`/api/scans/${job.id}/cancel`, {method: "POST"}); refresh(); };
  d.querySelectorAll(".tabs button").forEach((b) => b.onclick = () => {
    const v = b.dataset.all === "1"; if (v === showAll) return; showAll = v; refresh();
  });
  const q = $("q"); if (q) q.oninput = () => { query = q.value; $("rows").innerHTML = rowsHtml(current); };
}

async function refresh() {
  clearTimeout(timer);
  try {
    const jobs = await api("/api/scans");
    if (selected && !jobs.some((j) => j.id === selected)) select(null);
    if (!selected && jobs.length) select(jobs[0].id);
    renderJobs(jobs);
    renderDetail(selected ? await api(`/api/scans/${selected}${showAll ? "?entities=true" : ""}`) : null);
    if (jobs.some((j) => j.status === "queued" || j.status === "running")) timer = setTimeout(refresh, 2000);
  } catch (e) { $("health").textContent = e.message; }
}

$("scanForm").onsubmit = async (ev) => {
  ev.preventDefault();
  $("formError").classList.add("hidden");
  $("startBtn").disabled = true;
  try {
    const job = await api("/api/scans", {method: "POST", body: JSON.stringify({
      target: $("target").value, limit: Number($("limit").value), ocr: $("ocr").checked, fresh: $("fresh").checked})});
    select(job.id); $("target").value = "";
    refresh();
  } catch (e) { $("formError").textContent = e.message; $("formError").classList.remove("hidden"); }
  finally { $("startBtn").disabled = false; }
};
$("saveKey").onclick = () => {
  apiKey = $("apiKey").value.trim();
  try { localStorage.setItem("brandscan_key", apiKey); } catch (e) {}
  $("keyCard").classList.add("hidden"); loadIg(); refresh();
};

skeleton();
fetch("/api/health").then((r) => r.json()).then((h) => {
  $("health").textContent = h.worker_alive ? `v${h.version}` : "Worker stopped";
  $("healthDot").className = "dot " + (h.worker_alive ? "ok" : "bad");
  $("source").textContent = h.source === "graph" ? "Instagram Graph API" : "Instagram web";
  if (h.auth_required && !apiKey) $("keyCard").classList.remove("hidden");
  loadIg();
  refresh();
}).catch(() => {
  $("health").textContent = "Server unreachable"; $("healthDot").className = "dot bad";
  $("detail").innerHTML = '<div class="empty"><div><h2>Can\'t reach the server</h2><p>Check that <code>brandscan serve</code> is running, then reload.</p></div></div>';
});
</script>
</body>
</html>
